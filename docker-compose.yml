# MongoDB for local development: `npm run infra:up`, then `npm run start:dev`.
services:
  mongo:
    # the MongoDB driver used by mongoose 5.10 officially supports up to MongoDB 4.4
    image: mongo:4.4
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
